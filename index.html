<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prancheta">
<script>/* manifesto do app instalável só quando servido por http(s); aberto como arquivo local o navegador bloqueia e só gera erro no console */
if (/^https?:$/.test(location.protocol)) document.write('<link rel="manifest" href="manifest.webmanifest">');</script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Prancheta · Planejamento de jogos</title>
<meta name="description" content="Prancheta: planejamento de jogos, local e offline.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='3' width='24' height='27' rx='4' fill='%23f2b544'/%3E%3Crect x='11' y='1' width='10' height='6' rx='2' fill='%2316161b'/%3E%3Cpath d='M9 14h14M9 19h10M9 24h7' stroke='%2316161b' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<header class="topbar">
  <a class="brand" href="#/" aria-label="Prancheta, ir para todos os jogos">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="4" y="3" width="24" height="27" rx="4" fill="currentColor"/><rect x="11" y="1" width="10" height="6" rx="2" fill="var(--bg)"/><path d="M9 14h14M9 19h10M9 24h7" stroke="var(--bg)" stroke-width="2.4" stroke-linecap="round"/></svg></span>
    <span class="brand-text"><strong>Prancheta</strong><small>Planejamento de jogos</small></span>
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Caminho"></nav>
  <div class="topbar-right">
    <span class="save-state" id="saveState" role="status" aria-live="polite">Salvo neste navegador</span>
    <button class="btn primary sm install-btn" id="installBtn" type="button" hidden aria-label="Instalar o app Prancheta">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
      <span>Instalar app</span>
    </button>
    <button class="sync-chip" id="syncChip" type="button" data-action="sync" hidden aria-label="Sincronização com GitHub"></button>
    <div class="menu-wrap">
      <button class="btn ghost" id="dataMenuBtn" aria-label="Dados e backup" aria-haspopup="true" aria-expanded="false" aria-controls="dataMenu">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3Zm0 0v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span class="data-label">Dados e backup</span>
      </button>
      <div class="menu" id="dataMenu" role="menu" hidden>
        <button role="menuitem" data-action="export">Exportar backup (.json)</button>
        <button role="menuitem" data-action="import">Importar backup…</button>
        <hr>
        <button role="menuitem" data-action="sync">Sincronizar com GitHub…</button>
        <button role="menuitem" data-action="grok">Falar com o Grok Bot…</button>
        <hr>
        <button role="menuitem" data-action="restore-samples">Restaurar jogos de exemplo…</button>
        <button role="menuitem" class="danger" data-action="wipe">Apagar todos os dados…</button>
      </div>
    </div>
  </div>
</header>
<div class="banner" id="storageBanner" hidden></div>
<main id="main" tabindex="-1"></main>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<button class="fab" id="fab" type="button" data-action="fab" aria-label="Adicionar (novo jogo, tarefa, ideia ou efeito)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<noscript><p style="padding:2rem;color:#fff">A Prancheta precisa de JavaScript ativado no navegador.</p></noscript>
<script src="assets/recursos.js"></script>
<script src="assets/testes.js"></script>
<script src="assets/plano.js"></script>
<script src="assets/time.js"></script>
<script src="assets/ia.js"></script>
<script src="assets/equipe.js"></script>
<script src="assets/sync.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
